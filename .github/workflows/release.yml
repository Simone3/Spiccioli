# Builds the installers of one release on the three operating systems Spiccioli ships on, and collects them into a draft GitHub release.
#
# Pushing a "v*" tag is what starts it. The release it creates is a draft on purpose: nothing is published until the release notes have
# been read and the draft is published by hand.
#
# The installers cannot be built anywhere else than on the system they are for: the Squirrel installer needs Windows, and the Debian and
# RPM packages need the packaging tools of a Linux distribution. The matrix below is therefore what makes a release with all three
# possible at all.
name: Release

on:
  push:
    tags:
      - 'v*'

  # A run started by hand builds the installers and uploads them as workflow artifacts without creating a release, which is how this
  # workflow is tested without cutting a tag first
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One operating system failing must not cancel the others: which of the three broke is the useful thing to know
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (arm64)
          - os: windows-latest
            label: Windows (x64)
          - os: ubuntu-latest
            label: Linux (x64)

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The Node version matches the "engines.node" floor in package.json, which is the version Electron bundles
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The Debian and RPM makers shell out to these, and the GitHub runner image carries neither
      - name: Install the Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot rpm

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the installers
        run: npm run make

      # Only the files a user downloads are kept. The makers also write the Squirrel update files next to the installer, which are of no
      # use to anybody without an update server to serve them from.
      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            out/make/**/*.zip
            out/make/**/*.exe
            out/make/**/*.deb
            out/make/**/*.rpm

  release:
    name: Draft the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download the installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The GitHub CLI is installed on the runner and reads both of these, so the release needs no checkout and no token of its own
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Spiccioli $GITHUB_REF_NAME" \
            --generate-notes \
            $(find installers -type f | sort)
